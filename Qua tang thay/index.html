<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quà tặng thầy - Nhân viên Tài năng PVEP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f7f2e8;
      font-family: Arial, sans-serif;
    }

    /* Thanh phía trên */
    .topbar {
      width: 100%;
      padding: 16px 20px;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back {
      display: inline-block;
      text-decoration: none;
      color: #174a7e;
      font-weight: bold;
      font-size: 16px;
      padding: 10px 16px;
      border: 1px solid #174a7e;
      border-radius: 8px;
    }

    .back:hover {
      background: #174a7e;
      color: white;
    }

    /* Khu vực bài thơ */
    .poem {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 25px 15px 50px;
    }

    .poem img {
      display: block;
      width: 100%;
      max-width: 1100px;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }

    @media (max-width: 600px) {
      .poem {
        padding: 10px 5px 30px;
      }

      .topbar {
        padding: 10px;
      }

      .back {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <a class="back" href="../index.html">
      ← Quay lại trang chính
    </a>
  </div>

  <div class="poem">
    <img
      src="Tri%20%C3%A2n%20th%E1%BA%A7y%20Ng%C3%B4%20Kh%C3%A1nh%20X%E1%BA%A1(13).png"
      alt="Gửi Thầy Ngô Khánh Xạ - Người tận lòng dẫn lối">
  </div>

</body>
</html>
