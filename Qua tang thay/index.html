<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quà tặng thầy Ngô Khánh Xạ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f6f1e8;
      font-family: Arial, sans-serif;
    }

    .topbar {
      width: 100%;
      padding: 15px 25px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .back {
      text-decoration: none;
      color: #1769aa;
      font-size: 16px;
      font-weight: bold;
    }

    .page {
      width: 100%;
      text-align: center;
      padding: 25px 15px 50px;
    }

    h1 {
      color: #17356b;
      margin: 10px 0 5px;
      font-size: 34px;
    }

    .subtitle {
      color: #ad791b;
      font-size: 20px;
      margin-bottom: 25px;
    }

    .poem-image {
      display: block;
      width: 100%;
      max-width: 1000px;
      height: auto;
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 25px;
      }

      .subtitle {
        font-size: 17px;
      }

      .page {
        padding: 15px 8px 30px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <a class="back" href="../">← Về trang chính</a>
  </div>

  <div class="page">

    <h1>QUÀ TẶNG THẦY</h1>

    <div class="subtitle">
      Gửi Thầy Ngô Khánh Xạ – người tận lòng dẫn lối
    </div>

    <img
      class="poem-image"
      src="Tri ân thầy Ngô Khánh Xạ(13).png"
      alt="Bài thơ tri ân thầy Ngô Khánh Xạ"
    >

  </div>

</body>
</html>
