<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chương trình Nhân viên Tài năng PVEP</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#061c2a;
}

/* =========================
   COVER
========================= */

.cover{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
    background:#061c2a;
}

/* Chính ảnh mockup đã chốt */

.cover-image{
    position:absolute;
    inset:-1.5%;

    width:103%;
    height:103%;

    object-fit:cover;
    object-position:center;

    animation:coverMove 18s ease-in-out infinite alternate;
}


/* chuyển động cực nhẹ */

@keyframes coverMove{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.025);
    }

}


/* =========================
   NÚT KHÁM PHÁ
   đặt đè đúng vùng mockup
========================= */

.explore-link{

    position:absolute;

    left:40%;
    width:20%;

    bottom:10%;

    height:11%;

    z-index:10;

    cursor:pointer;

}


/* =========================
   MENU 6 MỤC
   vùng click trong suốt
========================= */

.nav{
    position:absolute;

    left:5%;
    right:5%;

    bottom:1.5%;

    height:8%;

    display:grid;

    grid-template-columns:repeat(6,1fr);

    z-index:10;
}

.nav a{
    display:block;
}


/* hiệu ứng khi rê chuột */

.nav a:hover{
    background:rgba(255,255,255,0.04);
}


/* =========================
   PHẦN HÀNH TRÌNH
========================= */

.content{

    min-height:100vh;

    background:#f4f7f6;

    padding:85px 8%;

    color:#243b34;
}

.content h2{

    text-align:center;

    font-size:36px;

    color:#006b54;

    margin-bottom:35px;
}


.intro{

    max-width:1000px;

    margin:auto;

    background:white;

    padding:40px;

    border-radius:16px;

    box-shadow:
        0 8px 28px rgba(0,0,0,.08);

    font-size:18px;

    line-height:1.8;

    text-align:center;
}


/* =========================
   5 BUỔI HỌC
========================= */

.sessions{

    max-width:1050px;

    margin:55px auto 0;

    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:18px;
}


.session{

    padding:28px 15px;

    background:white;

    text-align:center;

    border-radius:14px;

    text-decoration:none;

    color:#006b54;

    font-size:18px;

    font-weight:700;

    box-shadow:
        0 5px 20px rgba(0,0,0,.07);

    transition:.3s;
}


.session:hover{

    transform:translateY(-7px);

    box-shadow:
        0 12px 25px rgba(0,90,70,.13);
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .cover{
        height:auto;
        aspect-ratio:16/9;
    }

    .cover-image{
        width:100%;
        height:100%;
        inset:0;
        object-fit:cover;
    }

    .sessions{
        grid-template-columns:1fr 1fr;
    }

}


@media(max-width:500px){

    .sessions{
        grid-template-columns:1fr;
    }

}

</style>
</head>


<body>


<!-- =========================
     COVER ĐÚNG MOCKUP
========================= -->

<section class="cover">

    <img
        src="assets/images/cover-nvtn.png"
        alt="Chương trình Nhân viên Tài năng PVEP"
        class="cover-image"
    >


    <!-- nút KHÁM PHÁ HÀNH TRÌNH -->

    <a
        class="explore-link"
        href="#journey"
        aria-label="Khám phá hành trình">
    </a>


    <!-- 6 MENU Ở CUỐI COVER -->

    <nav class="nav">

        <a
            href="01_Gioi-thieu/"
            aria-label="Giới thiệu">
        </a>

        <a
            href="#journey"
            aria-label="Hành trình">
        </a>

        <a
            href="02_Các-buổi-học/"
            aria-label="Buổi học">
        </a>

        <a
            href="#library"
            aria-label="Thư viện">
        </a>

        <a
            href="#guestbook"
            aria-label="Lưu bút">
        </a>

        <a
            href="Qua%20tang%20thay/"
            aria-label="Món quà">
        </a>

    </nav>

</section>



<!-- =========================
     PHẦN SAU COVER
========================= -->

<section class="content" id="journey">

    <h2>
        HÀNH TRÌNH HỌC TẬP
    </h2>


    <div class="intro">

        Nơi lưu giữ hành trình học tập, chia sẻ kiến thức,
        những trải nghiệm và kỷ niệm của Nhóm Nhân viên Tài năng PVEP
        dưới sự hướng dẫn của Phó Tổng giám đốc Ngô Khánh Xạ.

    </div>



    <div class="sessions">

        <a class="session"
           href="02_Các-buổi-học/">
            BUỔI 1
        </a>

        <a class="session"
           href="02_Các-buổi-học/">
            BUỔI 2
        </a>

        <a class="session"
           href="02_Các-buổi-học/">
            BUỔI 3
        </a>

        <a class="session"
           href="02_Các-buổi-học/">
            BUỔI 4
        </a>

        <a class="session"
           href="02_Các-buổi-học/">
            BUỔI 5
        </a>

    </div>

</section>


</body>
</html>
