<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chương trình Nhân viên Tài năng PVEP</title>

<style>

/* =========================================================
   01. HỆ MÀU
========================================================= */

:root{
    --pvep-green:#62c947;
    --pvep-green-light:#8ee171;

    --navy:#05283f;
    --navy-deep:#031a2b;

    --white:#ffffff;

    --text:#183c32;
    --muted:#62756e;

    --line:rgba(255,255,255,.20);
}


/* =========================================================
   02. RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

html{
    scroll-behavior:smooth;
}

body{
    overflow:hidden;

    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;

    background:var(--navy-deep);

    color:white;
}

button,
a{
    font:inherit;
}

button{
    border:0;
}


/* =========================================================
   03. APP
========================================================= */

.app{
    position:relative;

    width:100vw;
    height:100vh;

    min-height:640px;

    overflow:hidden;

    isolation:isolate;
}


/* =========================================================
   04. BACKGROUND
========================================================= */

.background{
    position:absolute;
    inset:0;

    z-index:-3;

    background-image:
        url("assets/images/cover-nvtn-final.png");

    background-repeat:no-repeat;
    background-size:cover;
    background-position:64% center;

    transform:scale(1.01);
}


.background::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(2,25,41,.88) 0%,
            rgba(2,28,45,.78) 18%,
            rgba(2,31,47,.58) 36%,
            rgba(2,31,47,.30) 53%,
            rgba(2,31,47,.10) 70%,
            rgba(2,31,47,.02) 100%
        );
}


.background::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.05),
            rgba(0,0,0,.10)
        );
}


/* =========================================================
   05. HEADER
========================================================= */

.header{
    position:absolute;

    top:0;
    left:0;
    right:0;

    z-index:40;

    height:138px;

    display:flex;
    align-items:center;

    padding:
        24px
        5.3%;
}


.brand{
    display:flex;
    align-items:center;

    opacity:0;

    transform:translateY(-14px);

    animation:
        fadeDown
        .75s
        cubic-bezier(.2,.8,.2,1)
        .05s
        forwards;
}


.logo{
    width:88px;
    height:auto;

    display:block;

    filter:
        drop-shadow(
            0 3px 10px
            rgba(0,0,0,.12)
        );
}


.brand-divider{
    width:1px;
    height:75px;

    margin:
        0
        22px;

    background:
        rgba(255,255,255,.78);
}


.brand-name{
    font-size:29px;
    line-height:1;

    font-weight:800;

    letter-spacing:.8px;

    color:white;
}


.brand-company{
    margin-top:9px;

    font-size:16px;

    font-weight:400;

    letter-spacing:.65px;

    color:
        rgba(255,255,255,.91);
}


/* =========================================================
   06. VIEW
========================================================= */

.view{
    position:absolute;
    inset:0;

    z-index:10;

    opacity:0;
    visibility:hidden;
    pointer-events:none;

    transition:
        opacity .38s ease,
        visibility .38s ease;
}


.view.active{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}


/* =========================================================
   07. HOME HERO
========================================================= */

.hero{
    position:absolute;

    left:5.3%;
    top:48%;

    transform:translateY(-50%);

    width:min(680px,44vw);

    z-index:25;
}


/* CHƯƠNG TRÌNH - KHÓA FONT TIẾNG VIỆT */

.program{
    margin-bottom:22px;

    color:var(--pvep-green);

    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    font-style:normal;

    font-size:
        clamp(
            21px,
            1.7vw,
            28px
        );

    line-height:1.2;

    font-weight:800;

    letter-spacing:.5px;

    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;

    opacity:0;

    transform:translateX(-20px);

    animation:
        fadeLeft
        .65s
        ease
        .20s
        forwards;
}


/* NHÂN VIÊN TÀI NĂNG */

.hero-title{
    color:white;

    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    font-style:normal;

    font-size:
        clamp(
            56px,
            5.25vw,
            86px
        );

    line-height:.94;

    font-weight:800;

    letter-spacing:1.2px;

    text-transform:uppercase;

    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;

    text-shadow:
        0 3px 16px
        rgba(0,0,0,.25);

    opacity:0;

    transform:translateX(-24px);

    animation:
        fadeLeft
        .75s
        cubic-bezier(.2,.8,.2,1)
        .30s
        forwards;
}


.green-line{
    width:min(520px,100%);
    height:3px;

    margin:
        26px
        0
        19px;

    background:var(--pvep-green);

    transform-origin:left center;

    transform:scaleX(0);

    animation:
        lineGrow
        .76s
        ease
        .72s
        forwards;
}


.values{
    margin-bottom:17px;

    color:white;

    font-size:
        clamp(
            18px,
            1.48vw,
            25px
        );

    letter-spacing:.7px;

    white-space:nowrap;

    opacity:0;

    animation:
        fadeIn
        .65s
        ease
        .86s
        forwards;
}


.mentor{
    max-width:650px;

    margin-bottom:11px;

    color:white;

    font-size:
        clamp(
            16px,
            1.22vw,
            20px
        );

    line-height:1.5;

    font-weight:500;

    opacity:0;

    animation:
        fadeIn
        .65s
        ease
        1s
        forwards;
}


.years{
    color:white;

    font-size:20px;

    font-weight:800;

    letter-spacing:2px;

    opacity:0;

    animation:
        fadeIn
        .65s
        ease
        1.12s
        forwards;
}


/* =========================================================
   08. MENU CHÍNH
========================================================= */

.main-nav{
    position:absolute;

    left:5.3%;
    right:5.3%;
    bottom:25px;

    z-index:40;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:26px;

    opacity:0;

    animation:
        fadeIn
        .75s
        ease
        1.20s
        forwards;
}


.nav-btn{
    position:relative;

    min-height:48px;

    display:flex;
    align-items:baseline;

    gap:9px;

    padding:
        8px
        2px
        11px;

    background:transparent;

    color:white;

    text-align:left;

    cursor:pointer;

    transition:
        transform .25s ease,
        opacity .25s ease;
}


.nav-number{
    color:white;

    font-size:20px;

    font-weight:800;

    transition:
        color .25s ease,
        text-shadow .25s ease;
}


.nav-label{
    color:
        rgba(255,255,255,.93);

    font-size:14px;

    font-weight:600;

    letter-spacing:.4px;

    white-space:nowrap;

    transition:
        color .25s ease;
}


.nav-btn::after{
    content:"";

    position:absolute;

    left:0;
    bottom:0;

    width:0;
    height:2px;

    background:var(--pvep-green);

    box-shadow:
        0 0 12px
        rgba(98,201,71,.30);

    transition:
        width .30s ease;
}


.nav-btn:hover{
    transform:translateY(-4px);
}


.nav-btn:hover .nav-number{
    color:var(--pvep-green);
}


.nav-btn:hover .nav-label{
    color:white;
}


.nav-btn:hover::after{
    width:64px;
}


/* =========================================================
   09. DASHBOARD POPUP
========================================================= */

.dashboard{
    padding:
        152px
        5.3%
        38px;

    background:
        rgba(2,20,33,.70);

    backdrop-filter:
        blur(7px);
}


.dashboard-shell{
    width:100%;
    height:100%;

    max-width:1520px;

    margin:auto;

    display:grid;

    grid-template-columns:
        224px
        1fr;

    gap:28px;
}


/* =========================================================
   10. SIDEBAR
========================================================= */

.sidebar{
    height:100%;

    padding:
        24px
        17px;

    border:
        1px solid
        rgba(255,255,255,.14);

    border-radius:18px;

    background:
        rgba(4,32,49,.72);

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.12);
}


.home-btn{
    width:100%;

    margin-bottom:21px;

    padding:
        13px
        14px;

    border-radius:10px;

    background:
        rgba(98,201,71,.17);

    color:white;

    font-weight:800;

    text-align:left;

    cursor:pointer;
}


.side-menu{
    display:flex;

    flex-direction:column;

    gap:7px;
}


.side-btn{
    width:100%;

    padding:
        12px
        13px;

    border-radius:9px;

    background:transparent;

    color:
        rgba(255,255,255,.76);

    cursor:pointer;

    text-align:left;
}


.side-btn:hover{
    color:white;

    background:
        rgba(255,255,255,.07);
}


.side-btn.active{
    color:white;

    background:
        rgba(255,255,255,.10);

    border-left:
        3px solid
        var(--pvep-green);
}


/* =========================================================
   11. CONTENT PANEL
========================================================= */

.content-panel{
    height:100%;

    overflow:auto;

    padding:
        42px
        48px
        45px;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius:21px;

    background:
        rgba(249,253,251,.97);

    color:var(--text);

    box-shadow:
        0 28px 80px
        rgba(0,0,0,.22);
}


.content-animate{
    animation:
        panelIn
        .38s
        cubic-bezier(.2,.8,.2,1);
}


.section-kicker{
    margin-bottom:8px;

    color:var(--pvep-green);

    font-size:17px;

    font-weight:800;

    letter-spacing:1px;
}


.content-panel h1{
    margin-bottom:19px;

    color:#075e49;

    font-size:
        clamp(
            31px,
            3vw,
            42px
        );
}


.lead{
    max-width:930px;

    margin-bottom:31px;

    color:#4f625c;

    font-size:18px;

    line-height:1.8;
}


/* =========================================================
   12. HÀNH TRÌNH
========================================================= */

.timeline{
    position:relative;

    margin-top:45px;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:12px;
}


.timeline::before{
    content:"";

    position:absolute;

    top:30px;
    left:7%;
    right:7%;

    height:2px;

    background:
        rgba(7,94,73,.17);
}


.milestone{
    position:relative;

    z-index:2;

    text-align:center;
}


.dot{
    width:60px;
    height:60px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border:
        4px solid
        #eff7f2;

    border-radius:50%;

    background:#075e49;

    color:white;

    font-weight:800;

    box-shadow:
        0 7px 20px
        rgba(7,94,73,.13);
}


.milestone h3{
    margin-top:15px;

    color:#075e49;

    font-size:16px;
}


/* =========================================================
   13. BUỔI HỌC
========================================================= */

.lesson-grid{
    margin-top:30px;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:16px;
}


.lesson-card{
    min-height:190px;

    padding:25px;

    border:
        1px solid
        #edf3ef;

    border-radius:17px;

    background:
        linear-gradient(
            160deg,
            #ffffff,
            #eef7f2
        );

    box-shadow:
        0 9px 28px
        rgba(0,0,0,.075);

    text-align:left;
}


.lesson-no{
    margin-bottom:29px;

    color:var(--pvep-green);

    font-size:31px;

    font-weight:800;
}


.lesson-card h3{
    margin-bottom:8px;

    color:#075e49;

    font-size:19px;
}


.lesson-card p{
    color:#697a74;

    font-size:14px;

    line-height:1.55;
}


/* =========================================================
   14. THƯ VIỆN
========================================================= */

.library-grid{
    margin-top:31px;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;
}


.library-card{
    min-height:210px;

    padding:31px;

    border:
        1px solid
        #edf3ef;

    border-radius:18px;

    background:white;

    box-shadow:
        0 9px 28px
        rgba(0,0,0,.065);
}


.library-icon{
    margin-bottom:16px;

    font-size:34px;
}


.library-card h3{
    margin-bottom:9px;

    color:#075e49;
}


.library-card p{
    color:#6b7a75;

    line-height:1.6;
}


/* =========================================================
   15. ĐIỀU ĐỌNG LẠI
========================================================= */

.memory-grid{
    margin-top:31px;

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:20px;
}


.memory-card{
    min-height:220px;

    padding:33px;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            #075e49,
            #0d8262
        );

    color:white;

    text-align:left;

    cursor:pointer;
}


.memory-card h3{
    margin-bottom:13px;

    font-size:23px;
}


.memory-card p{
    color:
        rgba(255,255,255,.84);

    line-height:1.7;
}


/* =========================================================
   16. ANIMATION
========================================================= */

@keyframes fadeDown{

    to{
        opacity:1;
        transform:translateY(0);
    }
}


@keyframes fadeLeft{

    to{
        opacity:1;
        transform:translateX(0);
    }
}


@keyframes fadeIn{

    to{
        opacity:1;
    }
}


@keyframes lineGrow{

    to{
        transform:scaleX(1);
    }
}


@keyframes panelIn{

    from{
        opacity:0;

        transform:
            translateY(15px)
            scale(.992);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   17. TABLET
========================================================= */

@media(max-width:1100px){

    .hero{
        width:52vw;
    }

    .main-nav{
        gap:10px;
    }

    .nav-label{
        font-size:12px;
    }

    .lesson-grid{
        grid-template-columns:
            repeat(3,1fr);
    }

}


/* =========================================================
   18. MOBILE
========================================================= */

@media(max-width:800px){

    body{
        overflow:hidden;
    }


    .app{
        min-height:100svh;
    }


    .background{
        background-position:
            68% center;
    }


    .header{
        height:104px;

        padding:
            17px
            5%;
    }


    .logo{
        width:61px;
    }


    .brand-divider{
        height:54px;

        margin:
            0
            13px;
    }


    .brand-name{
        font-size:20px;
    }


    .brand-company{
        font-size:10px;

        letter-spacing:.3px;
    }


    .hero{
        left:5%;
        top:42%;

        width:90%;
    }


    .program{
        margin-bottom:14px;

        font-size:19px;

        letter-spacing:.35px;
    }


    .hero-title{
        font-size:
            clamp(
                43px,
                12vw,
                58px
            );
    }


    .green-line{
        margin:
            18px
            0
            15px;
    }


    .values{
        white-space:normal;

        font-size:16px;
    }


    .mentor{
        max-width:90%;

        font-size:14px;
    }


    .years{
        font-size:18px;
    }


    /* GIỮ 5 NÚT TRÊN MOBILE */

    .main-nav{
        left:4%;
        right:4%;
        bottom:18px;

        display:grid;

        grid-template-columns:
            repeat(5,1fr);

        gap:4px;
    }


    .nav-btn{
        min-height:50px;

        display:flex;

        flex-direction:column;

        justify-content:flex-start;

        align-items:center;

        gap:3px;

        padding:
            5px
            1px;

        text-align:center;
    }


    .nav-number{
        font-size:15px;

        color:var(--pvep-green);
    }


    .nav-label{
        font-size:
            clamp(
                7px,
                2.1vw,
                10px
            );

        line-height:1.15;

        white-space:normal;

        text-align:center;
    }


    .nav-btn::after{
        left:50%;

        transform:
            translateX(-50%);
    }


    /* POPUP MOBILE */

    .dashboard{
        padding:
            108px
            12px
            14px;
    }


    .dashboard-shell{
        display:block;
    }


    .sidebar{
        display:none;
    }


    .content-panel{
        height:
            calc(
                100svh - 124px
            );

        padding:
            27px
            21px
            34px;

        border-radius:20px;
    }


    .content-panel h1{
        font-size:30px;
    }


    .lead{
        font-size:15px;

        line-height:1.7;
    }


    .lesson-grid,
    .library-grid,
    .memory-grid{
        grid-template-columns:1fr;
    }


    .timeline{
        margin-top:35px;

        grid-template-columns:
            repeat(5,1fr);

        gap:4px;
    }


    .timeline::before{
        display:block;

        left:5%;
        right:5%;

        top:22px;
    }


    .dot{
        width:44px;
        height:44px;

        border-width:3px;

        font-size:13px;
    }


    .milestone h3{
        margin-top:9px;

        font-size:
            clamp(
                7px,
                2vw,
                10px
            );

        line-height:1.2;
    }

}


/* =========================================================
   19. MÀN HÌNH MOBILE NHỎ
========================================================= */

@media(max-width:420px){

    .hero{
        top:40%;
    }


    .program{
        font-size:17px;
    }


    .hero-title{
        font-size:43px;
    }


    .values{
        font-size:14px;
    }


    .mentor{
        font-size:13px;
    }


    .nav-number{
        font-size:14px;
    }


    .nav-label{
        font-size:7px;
    }

}


/* =========================================================
   20. REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }

}

</style>
</head>


<body>

<div class="app">


<div class="background"></div>


<header class="header">

    <div class="brand">

        <img
            src="assets/images/Logo-pvep.png"
            alt="PVEP"
            class="logo"
        >

        <div class="brand-divider"></div>

        <div>

            <div class="brand-name">
                PVEP
            </div>

            <div class="brand-company">
                TỔNG CÔNG TY THĂM DÒ KHAI THÁC DẦU KHÍ
            </div>

        </div>

    </div>

</header>



<section
    class="view active"
    id="homeView"
>


    <div class="hero">

        <div class="program">
            CHƯƠNG TRÌNH
        </div>


        <div class="hero-title">
            NHÂN VIÊN<br>
            TÀI NĂNG
        </div>


        <div class="green-line"></div>


        <div class="values">
            HỌC HỎI
            &nbsp;•&nbsp;
            KẾT NỐI
            &nbsp;•&nbsp;
            PHÁT TRIỂN
        </div>


        <div class="mentor">
            Phó Tổng giám đốc Ngô Khánh Xạ
            hướng dẫn và đồng hành
        </div>


        <div class="years">
            2025 — 2026
        </div>

    </div>



    <nav
        class="main-nav"
        aria-label="Menu chính"
    >


        <button
            class="nav-btn"
            type="button"
            onclick="openIntro()"
        >

            <span class="nav-number">01</span>

            <span class="nav-label">
                GIỚI THIỆU
            </span>

        </button>


        <button
            class="nav-btn"
            type="button"
           onclick="window.location.href='02_Hanh-trinh/'"
        >

            <span class="nav-number">02</span>

            <span class="nav-label">
                HÀNH TRÌNH
            </span>

        </button>


        <button
            class="nav-btn"
            type="button"
            onclick="navigate('lessons')"
        >

            <span class="nav-number">03</span>

            <span class="nav-label">
                BUỔI HỌC
            </span>

        </button>


        <button
            class="nav-btn"
            type="button"
            onclick="navigate('library')"
        >

            <span class="nav-number">04</span>

            <span class="nav-label">
                THƯ VIỆN
            </span>

        </button>


        <button
            class="nav-btn"
            type="button"

function navigate(route){


    if(route === "home"){

        window.location.hash =
            "#/home";

        showHome();

        return;

    }


    if(!pages[route]){

        showHome();

        return;

    }


    window.location.hash =
        "#/" + route;


    showDashboard(route);

}



function showHome(){

    const home =
        document.getElementById(
            "homeView"
        );


    const dashboard =
        document.getElementById(
            "dashboardView"
        );


    home
        .classList
        .add("active");


    dashboard
        .classList
        .remove("active");

}



function showDashboard(route){

    const home =
        document.getElementById(
            "homeView"
        );


    const dashboard =
        document.getElementById(
            "dashboardView"
        );


    const panel =
        document.getElementById(
            "contentPanel"
        );


    home
        .classList
        .remove("active");


    dashboard
        .classList
        .add("active");


    panel.innerHTML =
        pages[route];


    panel.classList.remove(
        "content-animate"
    );


    void panel.offsetWidth;


    panel.classList.add(
        "content-animate"
    );


    panel.scrollTop = 0;


    document
        .querySelectorAll(
            ".side-btn"
        )
        .forEach(
            function(btn){

                btn.classList.toggle(
                    "active",
                    btn.dataset.route === route
                );

            }
        );

}



function loadRoute(){

    let route =
        window.location.hash
        .replace(
            "#/",
            ""
        );


    if(
        !route ||
        route === "home"
    ){

        showHome();

        return;

    }


    if(
        pages[route]
    ){

        showDashboard(
            route
        );

        return;

    }


    showHome();

}



window.addEventListener(
    "hashchange",
    loadRoute
);


window.addEventListener(
    "load",
    loadRoute
);

</script>
