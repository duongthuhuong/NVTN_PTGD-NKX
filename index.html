<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chương trình Nhân viên Tài năng PVEP</title>

<style>

/* =========================================================
   01. RESET + BIẾN MÀU
========================================================= */

:root{
    --navy:#06263c;
    --navy-dark:#031827;
    --green:#66c94c;
    --green-soft:#8bdc72;
    --white:#ffffff;
    --text-dark:#16382f;
    --muted:#6a7c76;
    --glass:rgba(5,38,56,.74);
    --border:rgba(255,255,255,.16);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:
        Arial,
        "Helvetica Neue",
        Helvetica,
        sans-serif;
    background:var(--navy-dark);
    color:white;
}

button,
a{
    font:inherit;
}


/* =========================================================
   02. APP
========================================================= */

.app{
    position:relative;
    width:100vw;
    height:100vh;
    min-height:650px;
    overflow:hidden;
}


/* =========================================================
   03. ẢNH NỀN
   Ảnh đứng yên hoàn toàn
========================================================= */

.background{
    position:absolute;
    inset:0;

    background-image:
        url("assets/images/cover-nvtn-final.png");

    background-repeat:no-repeat;
    background-size:cover;
    background-position:center center;

    z-index:0;
}


/* Lớp phủ mềm để chữ nổi nhưng không chia đôi ảnh */

.background::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(3,27,44,.84) 0%,
            rgba(3,29,47,.68) 22%,
            rgba(3,31,48,.43) 42%,
            rgba(3,31,48,.17) 60%,
            rgba(3,31,48,.04) 78%,
            rgba(3,31,48,0) 100%
        );
}


/* =========================================================
   04. HEADER
========================================================= */

.header{
    position:absolute;
    top:0;
    left:0;
    right:0;

    height:140px;

    display:flex;
    align-items:center;

    padding:28px 5.4%;

    z-index:30;
}

.brand{
    display:flex;
    align-items:center;

    opacity:0;
    transform:translateY(-14px);

    animation:
        fadeDown .75s ease .05s forwards;
}

.logo{
    width:92px;
    height:auto;
    display:block;
}

.brand-divider{
    width:1px;
    height:76px;

    margin:0 22px;

    background:
        rgba(255,255,255,.78);
}

.brand-name{
    font-size:29px;
    font-weight:800;
    letter-spacing:.7px;
}

.brand-company{
    margin-top:7px;

    font-size:16px;
    font-weight:400;
    letter-spacing:.7px;

    color:
        rgba(255,255,255,.92);
}


/* =========================================================
   05. VIEW
========================================================= */

.view{
    position:absolute;
    inset:0;

    z-index:10;

    opacity:0;
    visibility:hidden;
    pointer-events:none;

    transition:
        opacity .35s ease,
        visibility .35s ease;
}

.view.active{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}


/* =========================================================
   06. HOME - KHỐI NỘI DUNG
========================================================= */

.hero{
    position:absolute;

    left:5.4%;
    top:48%;

    transform:translateY(-50%);

    width:min(680px,45vw);

    z-index:20;
}

.program{
    color:var(--green);

    font-size:28px;
    font-weight:800;

    letter-spacing:.3px;

    margin-bottom:24px;

    opacity:0;
    transform:translateX(-18px);

    animation:
        fadeLeft .65s ease .20s forwards;
}

.title{
    color:white;

    font-size:
        clamp(58px,5.2vw,84px);

    line-height:.96;

    font-weight:800;
    letter-spacing:1.4px;

    text-transform:uppercase;

    text-shadow:
        0 3px 14px
        rgba(0,0,0,.22);

    opacity:0;
    transform:translateX(-22px);

    animation:
        fadeLeft .72s ease .30s forwards;
}

.green-line{
    width:min(520px,100%);
    height:3px;

    margin:25px 0 20px;

    background:var(--green);

    transform-origin:left center;
    transform:scaleX(0);

    animation:
        lineGrow .72s ease .70s forwards;
}

.values{
    color:white;

    font-size:
        clamp(20px,1.55vw,26px);

    letter-spacing:.7px;

    white-space:nowrap;

    margin-bottom:18px;

    opacity:0;

    animation:
        fadeIn .65s ease .84s forwards;
}

.mentor{
    color:white;

    font-size:
        clamp(17px,1.26vw,21px);

    line-height:1.5;
    font-weight:500;

    margin-bottom:12px;

    opacity:0;

    animation:
        fadeIn .65s ease .98s forwards;
}

.years{
    color:white;

    font-size:21px;
    font-weight:800;

    letter-spacing:2px;

    opacity:0;

    animation:
        fadeIn .65s ease 1.10s forwards;
}


/* =========================================================
   07. NÚT KHÁM PHÁ
========================================================= */

.explore{
    position:absolute;

    left:50%;
    bottom:115px;

    transform:translateX(-50%);

    z-index:25;

    border:0;
    background:transparent;

    color:white;

    cursor:pointer;
    text-align:center;

    opacity:0;

    animation:
        fadeIn .7s ease 1.18s forwards;
}

.explore-circle{
    width:46px;
    height:46px;

    margin:0 auto 10px;

    border:
        2px solid var(--green);

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;

    animation:
        arrowFloat 1.8s
        ease-in-out infinite;
}

.explore-text{
    font-size:15px;
    font-weight:800;
    letter-spacing:.5px;
}


/* =========================================================
   08. MENU HTML THẬT
========================================================= */

.main-nav{
    position:absolute;

    left:5.4%;
    right:5.4%;
    bottom:28px;

    z-index:30;

    display:grid;
    grid-template-columns:
        repeat(5,1fr);

    gap:24px;

    opacity:0;

    animation:
        fadeIn .7s ease 1.28s forwards;
}

.nav-btn{
    position:relative;

    min-height:46px;

    display:flex;
    align-items:baseline;

    gap:9px;

    padding:8px 2px;

    border:0;
    background:transparent;

    color:white;

    text-align:left;

    cursor:pointer;

    transition:
        transform .25s ease,
        opacity .25s ease;
}

.nav-number{
    font-size:20px;
    font-weight:800;

    transition:
        color .25s ease;
}

.nav-label{
    font-size:14px;
    font-weight:600;

    letter-spacing:.4px;

    white-space:nowrap;
}

.nav-btn::after{
    content:"";

    position:absolute;

    left:0;
    bottom:0;

    width:0;
    height:2px;

    background:var(--green);

    transition:
        width .30s ease;
}

.nav-btn:hover{
    transform:translateY(-3px);
}

.nav-btn:hover .nav-number{
    color:var(--green);
}

.nav-btn:hover::after{
    width:60px;
}


/* =========================================================
   09. MÀN HÌNH DASHBOARD
========================================================= */

.dashboard{
    padding:
        155px 5.4%
        42px;

    background:
        rgba(2,20,32,.68);

    backdrop-filter:
        blur(6px);
}

.dashboard-shell{
    width:100%;
    height:100%;

    max-width:1500px;
    margin:auto;

    display:grid;

    grid-template-columns:
        220px 1fr;

    gap:28px;
}


/* =========================================================
   10. SIDEBAR
========================================================= */

.sidebar{
    height:100%;

    padding:25px 17px;

    border:
        1px solid var(--border);

    border-radius:18px;

    background:
        rgba(4,33,49,.72);

    backdrop-filter:
        blur(10px);
}

.home-btn{
    width:100%;

    padding:13px 14px;

    border:0;
    border-radius:10px;

    background:
        rgba(102,201,76,.16);

    color:white;

    cursor:pointer;

    font-weight:800;

    text-align:left;

    margin-bottom:20px;

    transition:.25s;
}

.home-btn:hover{
    background:
        rgba(102,201,76,.28);
}

.side-menu{
    display:flex;
    flex-direction:column;

    gap:7px;
}

.side-btn{
    width:100%;

    padding:12px 13px;

    border:0;
    border-radius:9px;

    background:transparent;

    color:
        rgba(255,255,255,.76);

    cursor:pointer;
    text-align:left;

    transition:.25s;
}

.side-btn:hover,
.side-btn.active{
    color:white;

    background:
        rgba(255,255,255,.09);
}

.side-btn.active{
    border-left:
        3px solid var(--green);
}


/* =========================================================
   11. CONTENT PANEL
========================================================= */

.content-panel{
    height:100%;

    overflow:auto;

    padding:42px 48px;

    border-radius:20px;

    border:
        1px solid var(--border);

    background:
        rgba(250,253,251,.97);

    color:var(--text-dark);

    box-shadow:
        0 28px 80px
        rgba(0,0,0,.24);

    animation:
        panelIn .36s ease;
}

.section-kicker{
    color:var(--green);

    font-size:17px;
    font-weight:800;

    letter-spacing:1px;

    margin-bottom:8px;
}

.content-panel h1{
    color:#075e49;

    font-size:40px;

    margin-bottom:20px;
}

.lead{
    max-width:900px;

    color:#4d625b;

    font-size:18px;

    line-height:1.8;

    margin-bottom:30px;
}


/* =========================================================
   12. GIỚI THIỆU
========================================================= */

.intro-grid{
    margin-top:30px;

    display:grid;
    grid-template-columns:
        repeat(3,1fr);

    gap:18px;
}

.info-card{
    padding:25px;

    border-radius:16px;

    background:white;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.07);
}

.info-card .num{
    color:var(--green);

    font-size:29px;
    font-weight:800;

    margin-bottom:10px;
}

.info-card h3{
    color:#075e49;

    font-size:18px;

    margin-bottom:9px;
}

.info-card p{
    color:#65766f;
    line-height:1.6;
}


/* =========================================================
   13. HÀNH TRÌNH
========================================================= */

.timeline{
    position:relative;

    margin-top:45px;

    display:grid;
    grid-template-columns:
        repeat(5,1fr);

    gap:12px;
}

.timeline::before{
    content:"";

    position:absolute;

    top:29px;
    left:7%;
    right:7%;

    height:2px;

    background:
        rgba(7,94,73,.17);
}

.milestone{
    position:relative;
    z-index:2;

    text-align:center;
}

.dot{
    width:58px;
    height:58px;

    margin:auto;

    border-radius:50%;

    background:#075e49;

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:800;

    border:
        4px solid #eef6f1;
}

.milestone h3{
    color:#075e49;

    margin-top:15px;

    font-size:16px;
}


/* =========================================================
   14. BUỔI HỌC
========================================================= */

.lesson-grid{
    margin-top:32px;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:16px;
}

.lesson-card{
    position:relative;

    min-height:185px;

    padding:24px;

    border:0;
    border-radius:16px;

    background:
        linear-gradient(
            160deg,
            #ffffff,
            #eef6f1
        );

    box-shadow:
        0 8px 28px
        rgba(0,0,0,.08);

    cursor:pointer;
    text-align:left;

    overflow:hidden;

    transition:
        transform .28s ease,
        box-shadow .28s ease;
}

.lesson-card::after{
    content:"";

    position:absolute;

    width:90px;
    height:90px;

    right:-25px;
    top:-25px;

    border-radius:50%;

    background:
        rgba(102,201,76,.12);
}

.lesson-card:hover{
    transform:translateY(-7px);

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.14);
}

.lesson-no{
    color:var(--green);

    font-size:30px;
    font-weight:800;

    margin-bottom:30px;
}

.lesson-card h3{
    color:#075e49;

    font-size:19px;

    margin-bottom:8px;
}

.lesson-card p{
    color:#687873;

    font-size:14px;

    line-height:1.55;
}


/* =========================================================
   15. THƯ VIỆN
========================================================= */

.library-grid{
    margin-top:32px;

    display:grid;
    grid-template-columns:
        repeat(3,1fr);

    gap:20px;
}

.library-card{
    padding:30px;

    border-radius:18px;

    background:white;

    box-shadow:
        0 8px 28px
        rgba(0,0,0,.07);

    cursor:pointer;

    transition:.25s;
}

.library-card:hover{
    transform:translateY(-5px);
}

.library-icon{
    font-size:31px;

    margin-bottom:16px;
}

.library-card h3{
    color:#075e49;

    margin-bottom:9px;
}

.library-card p{
    color:#6a7974;

    line-height:1.6;
}


/* =========================================================
   16. ĐIỀU ĐỌNG LẠI
========================================================= */

.memory-grid{
    margin-top:32px;

    display:grid;
    grid-template-columns:
        repeat(2,1fr);

    gap:20px;
}

.memory-card{
    min-height:205px;

    padding:32px;

    border-radius:18px;

    border:0;

    cursor:pointer;

    color:white;

    text-align:left;

    background:
        linear-gradient(
            145deg,
            #075e49,
            #0c8060
        );

    transition:
        transform .28s ease;
}

.memory-card:hover{
    transform:translateY(-6px);
}

.memory-card h3{
    font-size:23px;

    margin-bottom:12px;
}

.memory-card p{
    color:
        rgba(255,255,255,.82);

    line-height:1.7;
}


/* =========================================================
   17. ANIMATION
========================================================= */

@keyframes fadeDown{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeLeft{
    to{
        opacity:1;
        transform:translateX(0);
    }
}

@keyframes fadeIn{
    to{
        opacity:1;
    }
}

@keyframes lineGrow{
    to{
        transform:scaleX(1);
    }
}

@keyframes arrowFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(7px);
    }
}

@keyframes panelIn{
    from{
        opacity:0;
        transform:
            translateY(14px)
            scale(.99);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   18. RESPONSIVE
========================================================= */

@media(max-width:1100px){

    .hero{
        width:52vw;
    }

    .nav-label{
        font-size:12px;
    }

    .lesson-grid{
        grid-template-columns:
            repeat(3,1fr);
    }

    .intro-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:800px){

    body{
        overflow:auto;
    }

    .app{
        min-height:100svh;
    }

    .background{
        background-position:
            62% center;
    }

    .header{
        height:105px;

        padding:18px 5%;
    }

    .logo{
        width:62px;
    }

    .brand-divider{
        height:55px;
        margin:0 13px;
    }

    .brand-name{
        font-size:20px;
    }

    .brand-company{
        font-size:10px;
    }

    .hero{
        left:5%;
        top:46%;

        width:90%;
    }

    .program{
        font-size:20px;
    }

    .title{
        font-size:50px;
    }

    .values{
        white-space:normal;
        font-size:17px;
    }

    .mentor{
        font-size:16px;
    }

    .main-nav{
        display:none;
    }

    .explore{
        bottom:28px;
    }

    .dashboard{
        padding:
            118px 18px
            20px;
    }

    .dashboard-shell{
        display:block;
    }

    .sidebar{
        display:none;
    }

    .content-panel{
        padding:30px 22px;
    }

    .content-panel h1{
        font-size:31px;
    }

    .lesson-grid,
    .library-grid,
    .memory-grid{
        grid-template-columns:1fr;
    }

    .timeline{
        grid-template-columns:1fr;
        gap:18px;
    }

    .timeline::before{
        display:none;
    }

}

</style>
</head>


<body>

<div class="app">

    <!-- =====================================================
         ẢNH NỀN

    <div class="background"></div>


    <!-- =====================================================
         HEADER

        <div class="brand">

            <button

                <span class="nav-number">

                </span>

                </span>
            </button>


            <button

                <span class="nav-number">

            <button

            <button

        </nav>

    </section>


    <!-- =====================================================

    ====================================================== -->

    <section

    >

        <div class="dashboard-shell">

            <!-- SIDEBAR -->

            <aside class="sidebar">

                <button
                    class="home-btn"
                    onclick="navigate('home')"
                >
                    ← TRANG CHỦ
                </button>


                <div class="side-menu">

                    <button
                        class="side-btn"
                        data-route="intro"
                        onclick="navigate('intro')"
                    >
                        01 &nbsp; GIỚI THIỆU
                    </button>

                    <button
                        class="side-btn"
                        data-route="journey"

                    >
                        02 &nbsp; HÀNH TRÌNH
                    </button>

                    <button
                        class="side-btn"

                    >
                        03 &nbsp; BUỔI HỌC
                    </button>

                    <button
                        class="side-btn"
                        data-route="library"

                    >
                        04 &nbsp; THƯ VIỆN
                    </button>

                    <button
                        class="side-btn"
                        data-route="memories"

                        05 &nbsp; ĐIỀU ĐỌNG LẠI
                    </button>

                </div>

            </aside>


            <!-- NỘI DUNG -->

            <main
                class="content-panel"
                id="contentPanel"
            >
            </main>

        </div>

    </section>

</div>


<!-- =====================================================
     JAVASCRIPT SPA
===================================================== -->

<script>

const pages = {

    intro: `
        <div class="section-kicker">
            01
        </div>

        <h1>
            GIỚI THIỆU
        </h1>

        <p class="lead">
            Chương trình Nhân viên Tài năng PVEP

/* =========================================================
   ROUTER
========================================================= */

function navigate(route){

    if(route === "home"){

        window.location.hash =
            "#/home";

        showHome();

        return;
    }


    if(!pages[route]){
        route = "home";
    }


    window.location.hash =
        "#/" + route;


    showDashboard(route);
}


function showHome(){

    document
        .getElementById("homeView")
        .classList
        .add("active");


    document
        .getElementById("dashboardView")
        .classList
        .remove("active");
}


function showDashboard(route){

    document
        .getElementById("homeView")
        .classList
        .remove("active");


    document
        .getElementById("dashboardView")
        .classList
        .add("active");


    const panel =
        document.getElementById(
            "contentPanel"
        );


    panel.innerHTML =
        pages[route];


    document
        .querySelectorAll(
            ".side-btn"
        )
        .forEach(function(btn){

            btn.classList.toggle(
                "active",
                btn.dataset.route === route
            );

        });
}


/* =========================================================
   LOAD ROUTE
========================================================= */

function loadRoute(){

    let route =
        window.location.hash
        .replace("#/","");


    if(
        !route ||
        route === "home"
    ){

        showHome();

    }else if(
        pages[route]
    ){

        showDashboard(route);

    }else{

        showHome();
    }
}


window.addEventListener(
    "hashchange",
    loadRoute
);


window.addEventListener(
    "load",
    loadRoute
);

</script>
