<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chương trình Nhân viên Tài năng PVEP</title>

<style>

/* =========================================================
   01. HỆ MÀU
========================================================= */

:root{
    --pvep-green:#62c947;
    --pvep-green-light:#8ee171;

    --navy:#05283f;
    --navy-deep:#031a2b;

    --white:#ffffff;

    --text:#183c32;
    --muted:#62756e;

    --glass-dark:rgba(3,31,49,.74);
    --glass-light:rgba(255,255,255,.96);

    --line:rgba(255,255,255,.20);
}


/* =========================================================
   02. RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

html{
    scroll-behavior:smooth;
}

body{
    overflow:hidden;

    font-family:
        Arial,
        "Helvetica Neue",
        Helvetica,
        sans-serif;

    background:var(--navy-deep);

    color:white;
}

button,
a{
    font:inherit;
}

button{
    border:0;
}


/* =========================================================
   03. APP
========================================================= */

.app{
    position:relative;

    width:100vw;
    height:100vh;

    min-height:640px;

    overflow:hidden;

    isolation:isolate;
}


/* =========================================================
   04. BACKGROUND

   Chỉ là ảnh nền.
   Không còn chữ/menu nằm chết trong ảnh.
========================================================= */

.background{
    position:absolute;
    inset:0;

    z-index:-3;

    background-image:
        url("assets/images/cover-nvtn-final.png");

    background-repeat:no-repeat;

    /*
      Ảnh được dùng như ảnh nền thực sự.
      Có thể crop một phần rất nhỏ tùy màn hình,
      nhưng không ảnh hưởng chữ/menu vì chữ/menu là HTML.
    */
    background-size:cover;

    /*
      Đẩy trọng tâm sang phải để giữ giàn khoan.
    */
    background-position:64% center;

    transform:scale(1.01);
}


/* Lớp phủ mềm, không chia đôi ảnh */

.background::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(2,25,41,.88) 0%,
            rgba(2,28,45,.78) 18%,
            rgba(2,31,47,.58) 36%,
            rgba(2,31,47,.30) 53%,
            rgba(2,31,47,.10) 70%,
            rgba(2,31,47,.02) 100%
        );
}


/* Một lớp tối rất nhẹ toàn màn */

.background::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.05),
            rgba(0,0,0,.10)
        );
}


/* =========================================================
   05. HEADER
========================================================= */

.header{
    position:absolute;

    top:0;
    left:0;
    right:0;

    z-index:40;

    height:138px;

    display:flex;
    align-items:center;

    padding:
        24px
        5.3%;
}


.brand{
    display:flex;
    align-items:center;

    opacity:0;

    transform:
        translateY(-14px);

    animation:
        fadeDown
        .75s
        cubic-bezier(.2,.8,.2,1)
        .05s
        forwards;
}


.logo{
    width:88px;
    height:auto;

    display:block;

    filter:
        drop-shadow(
            0 3px 10px
            rgba(0,0,0,.12)
        );
}


.brand-divider{
    width:1px;
    height:75px;

    margin:
        0
        22px;

    background:
        rgba(255,255,255,.78);
}


.brand-name{
    font-size:29px;
    line-height:1;

    font-weight:800;

    letter-spacing:.8px;

    color:white;
}


.brand-company{
    margin-top:9px;

    font-size:16px;

    font-weight:400;

    letter-spacing:.65px;

    color:
        rgba(255,255,255,.91);
}


/* =========================================================
   06. VIEW SYSTEM
========================================================= */

.view{
    position:absolute;
    inset:0;

    z-index:10;

    opacity:0;

    visibility:hidden;

    pointer-events:none;

    transition:
        opacity .38s ease,
        visibility .38s ease;
}


.view.active{
    opacity:1;

    visibility:visible;

    pointer-events:auto;
}


/* =========================================================
   07. HOME HERO
========================================================= */

.hero{
    position:absolute;

    left:5.3%;
    top:48%;

    transform:
        translateY(-50%);

    width:
        min(
            680px,
            44vw
        );

    z-index:25;
}


.program{
    margin-bottom:22px;

    color:
        var(--pvep-green);

    font-size:
        clamp(
            21px,
            1.7vw,
            28px
        );

    font-weight:800;

    letter-spacing:.5px;

    opacity:0;

    transform:
        translateX(-20px);

    animation:
        fadeLeft
        .65s
        ease
        .20s
        forwards;
}


.hero-title{
    color:white;

    font-size:
        clamp(
            56px,
            5.25vw,
            86px
        );

    line-height:.94;

    font-weight:800;

    letter-spacing:1.2px;

    text-transform:uppercase;

    text-shadow:
        0 3px 16px
        rgba(0,0,0,.25);

    opacity:0;

    transform:
        translateX(-24px);

    animation:
        fadeLeft
        .75s
        cubic-bezier(.2,.8,.2,1)
        .30s
        forwards;
}


.green-line{
    width:
        min(
            520px,
            100%
        );

    height:3px;

    margin:
        26px
        0
        19px;

    background:
        var(--pvep-green);

    transform-origin:
        left center;

    transform:
        scaleX(0);

    animation:
        lineGrow
        .76s
        ease
        .72s
        forwards;
}


.values{
    margin-bottom:17px;

    color:white;

    font-size:
        clamp(
            18px,
            1.48vw,
            25px
        );

    letter-spacing:.7px;

    white-space:nowrap;

    opacity:0;

    animation:
        fadeIn
        .65s
        ease
        .86s
        forwards;
}


.mentor{
    max-width:650px;

    margin-bottom:11px;

    color:white;

    font-size:
        clamp(
            16px,
            1.22vw,
            20px
        );

    line-height:1.5;

    font-weight:500;

    opacity:0;

    animation:
        fadeIn
        .65s
        ease
        1s
        forwards;
}


.years{
    color:white;

    font-size:20px;

    font-weight:800;

    letter-spacing:2px;

    opacity:0;

    animation:
        fadeIn
        .65s
        ease
        1.12s
        forwards;
}


/* =========================================================
   08. KHÁM PHÁ HÀNH TRÌNH
========================================================= */

.explore{
    position:absolute;

    left:50%;
    bottom:112px;

    transform:
        translateX(-50%);

    z-index:35;

    display:flex;
    flex-direction:column;
    align-items:center;

    background:none;

    color:white;

    cursor:pointer;

    opacity:0;

    animation:
        fadeIn
        .75s
        ease
        1.22s
        forwards;
}


.explore-circle{
    width:46px;
    height:46px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:9px;

    border:
        2px solid
        var(--pvep-green);

    border-radius:50%;

    font-size:23px;

    transition:
        background .25s ease,
        transform .25s ease;

    animation:
        arrowFloat
        1.9s
        ease-in-out
        infinite;
}


.explore:hover
.explore-circle{
    background:
        rgba(98,201,71,.16);
}


.explore-text{
    color:white;

    font-size:14px;

    font-weight:800;

    letter-spacing:.7px;
}


/* =========================================================
   09. MENU HTML THẬT
========================================================= */

.main-nav{
    position:absolute;

    left:5.3%;
    right:5.3%;
    bottom:25px;

    z-index:40;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:26px;

    opacity:0;

    animation:
        fadeIn
        .75s
        ease
        1.32s
        forwards;
}


.nav-btn{
    position:relative;

    min-height:48px;

    display:flex;
    align-items:baseline;

    gap:9px;

    padding:
        8px
        2px
        11px;

    background:transparent;

    color:white;

    text-align:left;

    cursor:pointer;

    transition:
        transform .25s ease,
        opacity .25s ease;
}


.nav-number{
    color:white;

    font-size:20px;

    font-weight:800;

    transition:
        color .25s ease,
        text-shadow .25s ease;
}


.nav-label{
    color:
        rgba(255,255,255,.93);

    font-size:14px;

    font-weight:600;

    letter-spacing:.4px;

    white-space:nowrap;

    transition:
        color .25s ease;
}


.nav-btn::after{
    content:"";

    position:absolute;

    left:0;
    bottom:0;

    width:0;
    height:2px;

    background:
        var(--pvep-green);

    box-shadow:
        0 0 12px
        rgba(98,201,71,.30);

    transition:
        width .30s ease;
}


.nav-btn:hover{
    transform:
        translateY(-4px);
}


.nav-btn:hover
.nav-number{
    color:
        var(--pvep-green);

    text-shadow:
        0 0 15px
        rgba(98,201,71,.28);
}


.nav-btn:hover
.nav-label{
    color:white;
}


.nav-btn:hover::after{
    width:64px;
}


/* =========================================================
   10. DASHBOARD
========================================================= */

.dashboard{
    padding:
        152px
        5.3%
        38px;

    background:
        rgba(2,20,33,.70);

    backdrop-filter:
        blur(7px);
}


.dashboard-shell{
    width:100%;
    height:100%;

    max-width:1520px;

    margin:auto;

    display:grid;

    grid-template-columns:
        224px
        1fr;

    gap:28px;
}


/* =========================================================
   11. SIDEBAR
========================================================= */

.sidebar{
    height:100%;

    padding:
        24px
        17px;

    border:
        1px solid
        rgba(255,255,255,.14);

    border-radius:18px;

    background:
        rgba(4,32,49,.72);

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.12);
}


.home-btn{
    width:100%;

    margin-bottom:21px;

    padding:
        13px
        14px;

    border-radius:10px;

    background:
        rgba(98,201,71,.17);

    color:white;

    font-weight:800;

    text-align:left;

    cursor:pointer;

    transition:
        background .25s ease,
        transform .25s ease;
}


.home-btn:hover{
    background:
        rgba(98,201,71,.29);

    transform:
        translateX(2px);
}


.side-menu{
    display:flex;

    flex-direction:column;

    gap:7px;
}


.side-btn{
    width:100%;

    padding:
        12px
        13px;

    border-radius:9px;

    background:
        transparent;

    color:
        rgba(255,255,255,.76);

    cursor:pointer;

    text-align:left;

    transition:
        background .25s ease,
        color .25s ease,
        transform .25s ease;
}


.side-btn:hover{
    color:white;

    background:
        rgba(255,255,255,.07);

    transform:
        translateX(2px);
}


.side-btn.active{
    color:white;

    background:
        rgba(255,255,255,.10);

    border-left:
        3px solid
        var(--pvep-green);
}


/* =========================================================
   12. CONTENT PANEL
========================================================= */

.content-panel{
    height:100%;

    overflow:auto;

    padding:
        42px
        48px
        45px;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius:21px;

    background:
        rgba(249,253,251,.97);

    color:
        var(--text);

    box-shadow:
        0 28px 80px
        rgba(0,0,0,.22);
}


.content-animate{
    animation:
        panelIn
        .38s
        cubic-bezier(.2,.8,.2,1);
}


.section-kicker{
    margin-bottom:8px;

    color:
        var(--pvep-green);

    font-size:17px;

    font-weight:800;

    letter-spacing:1px;
}


.content-panel h1{
    margin-bottom:19px;

    color:#075e49;

    font-size:
        clamp(
            31px,
            3vw,
            42px
        );
}


.lead{
    max-width:930px;

    margin-bottom:31px;

    color:#4f625c;

    font-size:18px;

    line-height:1.8;
}


/* =========================================================
   13. GIỚI THIỆU
========================================================= */

.intro-grid{
    margin-top:29px;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:18px;
}


.info-card{
    position:relative;

    padding:27px;

    overflow:hidden;

    border:
        1px solid
        #edf3ef;

    border-radius:17px;

    background:white;

    box-shadow:
        0 9px 27px
        rgba(0,0,0,.065);

    transition:
        transform .28s ease,
        box-shadow .28s ease;
}


.info-card:hover{
    transform:
        translateY(-5px);

    box-shadow:
        0 16px 36px
        rgba(0,0,0,.10);
}


.info-card::after{
    content:"";

    position:absolute;

    top:-35px;
    right:-35px;

    width:100px;
    height:100px;

    border-radius:50%;

    background:
        rgba(98,201,71,.10);
}


.info-num{
    margin-bottom:12px;

    color:
        var(--pvep-green);

    font-size:30px;

    font-weight:800;
}


.info-card h3{
    margin-bottom:9px;

    color:#075e49;

    font-size:18px;
}


.info-card p{
    color:
        var(--muted);

    line-height:1.65;
}


/* =========================================================
   14. HÀNH TRÌNH
========================================================= */

.timeline{
    position:relative;

    margin-top:45px;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:12px;
}


.timeline::before{
    content:"";

    position:absolute;

    top:30px;
    left:7%;
    right:7%;

    height:2px;

    background:
        rgba(7,94,73,.17);
}


.milestone{
    position:relative;

    z-index:2;

    text-align:center;
}


.dot{
    width:60px;
    height:60px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border:
        4px solid
        #eff7f2;

    border-radius:50%;

    background:#075e49;

    color:white;

    font-weight:800;

    box-shadow:
        0 7px 20px
        rgba(7,94,73,.13);
}


.milestone h3{
    margin-top:15px;

    color:#075e49;

    font-size:16px;
}


/* =========================================================
   15. BUỔI HỌC
========================================================= */

.lesson-grid{
    margin-top:30px;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:16px;
}


.lesson-card{
    position:relative;

    min-height:190px;

    padding:25px;

    overflow:hidden;

    border:
        1px solid
        #edf3ef;

    border-radius:17px;

    background:
        linear-gradient(
            160deg,
            #ffffff,
            #eef7f2
        );

    box-shadow:
        0 9px 28px
        rgba(0,0,0,.075);

    text-align:left;

    cursor:pointer;

    transition:
        transform .28s ease,
        box-shadow .28s ease;
}


.lesson-card::after{
    content:"";

    position:absolute;

    top:-30px;
    right:-30px;

    width:100px;
    height:100px;

    border-radius:50%;

    background:
        rgba(98,201,71,.12);
}


.lesson-card:hover{
    transform:
        translateY(-7px);

    box-shadow:
        0 17px 38px
        rgba(0,0,0,.12);
}


.lesson-no{
    margin-bottom:29px;

    color:
        var(--pvep-green);

    font-size:31px;

    font-weight:800;
}


.lesson-card h3{
    margin-bottom:8px;

    color:#075e49;

    font-size:19px;
}


.lesson-card p{
    color:#697a74;

    font-size:14px;

    line-height:1.55;
}


/* =========================================================
   16. THƯ VIỆN
========================================================= */

.library-grid{
    margin-top:31px;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;
}


.library-card{
    min-height:210px;

    padding:31px;

    border:
        1px solid
        #edf3ef;

    border-radius:18px;

    background:white;

    box-shadow:
        0 9px 28px
        rgba(0,0,0,.065);

    cursor:pointer;

    transition:
        transform .28s ease,
        box-shadow .28s ease;
}


.library-card:hover{
    transform:
        translateY(-6px);

    box-shadow:
        0 16px 36px
        rgba(0,0,0,.10);
}


.library-icon{
    margin-bottom:16px;

    font-size:34px;
}


.library-card h3{
    margin-bottom:9px;

    color:#075e49;
}


.library-card p{
    color:#6b7a75;

    line-height:1.6;
}


/* =========================================================
   17. ĐIỀU ĐỌNG LẠI
========================================================= */

.memory-grid{
    margin-top:31px;

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:20px;
}


.memory-card{
    position:relative;

    min-height:220px;

    padding:33px;

    overflow:hidden;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            #075e49,
            #0d8262
        );

    color:white;

    text-align:left;

    cursor:pointer;

    transition:
        transform .28s ease,
        box-shadow .28s ease;
}


.memory-card::after{
    content:"";

    position:absolute;

    right:-60px;
    bottom:-70px;

    width:190px;
    height:190px;

    border-radius:50%;

    background:
        rgba(255,255,255,.055);
}


.memory-card:hover{
    transform:
        translateY(-6px);

    box-shadow:
        0 16px 36px
        rgba(0,0,0,.16);
}


.memory-card h3{
    margin-bottom:13px;

    font-size:23px;
}


.memory-card p{
    max-width:430px;

    color:
        rgba(255,255,255,.84);

    line-height:1.7;
}


/* =========================================================
   18. ANIMATION
========================================================= */

@keyframes fadeDown{

    to{
        opacity:1;

        transform:
            translateY(0);
    }
}


@keyframes fadeLeft{

    to{
        opacity:1;

        transform:
            translateX(0);
    }
}


@keyframes fadeIn{

    to{
        opacity:1;
    }
}


@keyframes lineGrow{

    to{
        transform:
            scaleX(1);
    }
}


@keyframes arrowFloat{

    0%,
    100%{
        transform:
            translateY(0);
    }

    50%{
        transform:
            translateY(7px);
    }
}


@keyframes panelIn{

    from{
        opacity:0;

        transform:
            translateY(15px)
            scale(.992);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* Tôn trọng người dùng tắt chuyển động */

@media(
    prefers-reduced-motion:
    reduce
){

    *,
    *::before,
    *::after{
        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;
    }
}


/* =========================================================
   19. RESPONSIVE TABLET
========================================================= */

@media(
    max-width:1100px
){

    .hero{
        width:52vw;
    }

    .main-nav{
        gap:10px;
    }

    .nav-label{
        font-size:12px;
    }

    .lesson-grid{
        grid-template-columns:
            repeat(3,1fr);
    }

    .intro-grid{
        grid-template-columns:
            1fr;
    }

}


/* =========================================================
   20. RESPONSIVE MOBILE
========================================================= */

@media(
    max-width:800px
){

    body{
        overflow:auto;
    }


    .app{
        min-height:
            100svh;
    }


    .background{
        background-position:
            68% center;
    }


    .header{
        height:104px;

        padding:
            17px
            5%;
    }


    .logo{
        width:61px;
    }


    .brand-divider{
        height:54px;

        margin:
            0
            13px;
    }


    .brand-name{
        font-size:20px;
    }


    .brand-company{
        font-size:10px;

        letter-spacing:.3px;
    }


    .hero{
        left:5%;
        top:45%;

        width:90%;
    }


    .program{
        margin-bottom:16px;

        font-size:20px;
    }


    .hero-title{
        font-size:49px;
    }


    .green-line{
        margin:
            18px
            0
            15px;
    }


    .values{
        white-space:normal;

        font-size:17px;
    }


    .mentor{
        font-size:15px;
    }


    .main-nav{
        display:none;
    }


    .explore{
        bottom:27px;
    }


    .dashboard{
        padding:
            116px
            18px
            20px;
    }


    .dashboard-shell{
        display:block;
    }


    .sidebar{
        display:none;
    }


    .content-panel{
        padding:
            29px
            22px
            35px;
    }


    .content-panel h1{
        font-size:31px;

/* =========================================================
   ROUTER
========================================================= */

function navigate(route){

    if(route === "home"){

        window.location.hash =
            "#/home";

        showHome();

        return;
    }


    if(!pages[route]){

        route =
            "home";
    }


    window.location.hash =
        "#/" + route;


    showDashboard(route);
}


/* =========================================================
   HOME
========================================================= */

function showHome(){

    const home =
        document.getElementById(
            "homeView"
        );


    const dashboard =
        document.getElementById(
            "dashboardView"
        );


    home
        .classList
        .add("active");


    dashboard
        .classList
        .remove("active");
}


/* =========================================================
   DASHBOARD
========================================================= */

function showDashboard(route){

    const home =
        document.getElementById(
            "homeView"
        );


    const dashboard =
        document.getElementById(
            "dashboardView"
        );


    const panel =
        document.getElementById(
            "contentPanel"
        );


    home
        .classList
        .remove("active");


    dashboard
        .classList
        .add("active");


    /*
       Render nội dung
    */

    panel.innerHTML =
        pages[route];


    /*
       Animation lại mỗi lần chuyển trang
    */

    panel.classList.remove(
        "content-animate"
    );


    void panel.offsetWidth;


    panel.classList.add(
        "content-animate"
    );


    /*
       Cuộn nội dung về đầu
    */

    panel.scrollTop = 0;


    /*
       Active menu bên trái
    */

    document
        .querySelectorAll(
            ".side-btn"
        )
        .forEach(
            function(btn){

                btn.classList.toggle(
                    "active",
                    btn.dataset.route === route
                );

            }
        );
}


/* =========================================================
   ĐỌC HASH KHI MỞ TRANG
========================================================= */

function loadRoute(){

    let route =
        window.location.hash
        .replace(
            "#/",
            ""
        );


    if(
        !route ||
        route === "home"
    ){

        showHome();

        return;
    }


    if(
        pages[route]
    ){

        showDashboard(
            route
        );

        return;
    }


    showHome();
}


/* =========================================================
   EVENTS
========================================================= */

window.addEventListener(
    "hashchange",
    loadRoute
);


window.addEventListener(
    "load",
    loadRoute
);
