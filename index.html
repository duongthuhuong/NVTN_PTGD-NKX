<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nhân viên tài năng PVEP</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: auto;
            padding: 40px 20px;
            background: #f5f7f8;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #006b54;
        }

        h2 {
            text-align: center;
            font-weight: normal;
            color: #555;
        }

        .intro {
            background: white;
            padding: 25px;
            margin-top: 30px;
            border-radius: 12px;
            line-height: 1.7;
        }

        .section-title {
            margin-top: 40px;
            text-align: center;
            color: #006b54;
        }

        .sessions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-top: 25px;
        }

        .session {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            color: #006b54;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: 0.2s;
        }

        .session:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.12);
        }

        .gift {
            margin-top: 40px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .gift a {
            text-decoration: none;
            font-size: 20px;
            color: #8b3a62;
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>CHƯƠNG TRÌNH NHÂN VIÊN TÀI NĂNG PVEP</h1>

    <h2>Đồng hành cùng PTGĐ Ngô Khánh Xạ</h2>

    <div class="intro">
        <p>
            Nơi lưu giữ hành trình học tập, chia sẻ kiến thức và những kỷ niệm
            của Nhóm Nhân viên tài năng PVEP.
        </p>
    </div>

    <h2 class="section-title">HÀNH TRÌNH HỌC TẬP</h2>

    <div class="sessions">

        <a class="session" href="02_Các-buoi-hoc/Buoi-01/">
            BUỔI 1
        </a>

        <a class="session" href="02_Các-buoi-hoc/Buoi-02/">
            BUỔI 2
        </a>

        <a class="session" href="02_Các-buoi-hoc/buoi-03/">
            BUỔI 3
        </a>

        <a class="session" href="02_Các-buoi-hoc/buoi-04/">
            BUỔI 4
        </a>

        <a class="session" href="02_Các-buoi-hoc/buoi-05/">
            BUỔI 5
        </a>

    </div>

    <div class="gift">
        <a href="Qua tang thay/">
            🌷 QUÀ TẶNG THẦY
        </a>
    </div>

    <footer>
        Nhóm Nhân viên tài năng PVEP
    </footer>

</body>
</html>
